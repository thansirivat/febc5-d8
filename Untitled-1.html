    <!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        h1 {
            text-align: center;
            margin: 20px 0 50px;
            font-size: 40px;
        }

        .container {
            width: 94%;
            max-width: 1200px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;

            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
        }

        h2 {
            margin-top: 0;
            font-size: 28px;
        }

        #todo {
            border: none;
            outline: none;
            font-size: 18px;
            width: 100%;
            margin: 20px 0;
        }

        #todo::placeholder {
            color: #999;
        }

        #results {
            margin-top: 20px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px 5px;
            font-size: 20px;
        }

        .todo-text {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .delete-btn {
            border: none;
            background: none;
            font-size: 18px;
            cursor: pointer;
        }

        .delete-btn:hover {
            color: red;
        }
    </style>
</head>

<body>

    <h1>To-Do List</h1>

    <div class="container">

        <h2>งานที่ต้องทำวันนี้</h2>

        <input
            type="text"
            id="todo"
            placeholder="เพิ่มงานใหม่"
        >

        <div id="results">

           
    </div>


    <script>

        // กด Enter เพื่อเพิ่มงาน
        document.getElementById("todo").addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                addTask();
            }

        });


        function addTask() {

            let input = document.getElementById("todo");

            let task = input.value.trim();

            // ถ้าไม่ได้พิมพ์อะไร ไม่ต้องเพิ่ม
            if (task === "") {
                return;
            }

            let newElement = document.createElement("div");

            newElement.classList.add("todo-item");

            newElement.innerHTML = `
                <div class="todo-text">
                    📝
                    <span>${task}</span>
                </div>

                <button class="delete-btn"
                    onclick="deleteTask(this)">
                    Delete
                </button>
            `;

            let result = document.getElementById("results");

            result.appendChild(newElement);

            // ล้างช่อง input
            input.value = "";
        }


        function deleteTask(button) {

            // ลบ element ที่เป็น todo-item
            button.parentElement.remove();

        }

    </script>

</body>

</html>
    
</body>
</html>
